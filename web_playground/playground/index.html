<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valdi Widgets — Web Playground</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f2f3f5; color: #16191c; }
    #app { display: flex; height: 100%; }
    .nav { width: 260px; flex-shrink: 0; overflow-y: auto; background: #fff; border-right: 1px solid #dfe1e5; padding: 16px 0; box-sizing: border-box; }
    .nav h1 { font-size: 16px; margin: 0 16px 4px; }
    .nav p { font-size: 12px; color: #646a73; margin: 0 16px 12px; }
    .nav a { display: block; padding: 8px 16px; color: inherit; text-decoration: none; border-left: 3px solid transparent; }
    .nav a:hover { background: #f2f3f5; }
    .nav a[aria-current="page"] { border-left-color: #0fadff; background: #eef8ff; font-weight: 600; }
    .nav a small { display: block; font-weight: 400; font-size: 11px; color: #646a73; margin-top: 2px; }
    .stage { flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 24px; box-sizing: border-box; }
    .device { width: 375px; height: 812px; flex-shrink: 0; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
    .device > div { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app">Loading Valdi...</div>
  <script src="/bundle.js"></script>
</body>
</html>
